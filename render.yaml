# Render Blueprint: one free web service that serves both the API (/api/...) and the React app.
# Render → New → Blueprint → pick this repository. You'll be asked for the values marked sync: false.
services:
  - type: web
    name: shopkart
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && VITE_API_URL=/api npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: SERVE_FRONTEND
        value: "true"
      - key: TRUST_PROXY
        value: "1"
      - key: ENABLE_ORDER_STATUS_DEMO
        value: "true"
      - key: MONGOMS_DISABLE_POSTINSTALL
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
