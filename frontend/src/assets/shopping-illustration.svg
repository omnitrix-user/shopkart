<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" fill="none">
  <!-- Original ShopKart illustration: shopping bag, price tag and parcel -->
  <ellipse cx="160" cy="238" rx="118" ry="12" fill="#1E1B4B" opacity=".35"/>

  <!-- Parcel -->
  <rect x="198" y="150" width="86" height="80" rx="8" fill="#C7D2FE"/>
  <rect x="198" y="150" width="86" height="22" rx="8" fill="#A5B4FC"/>
  <rect x="234" y="150" width="14" height="80" fill="#818CF8"/>

  <!-- Bag -->
  <path d="M112 72V60a40 40 0 0 1 80 0v12" stroke="#E0E7FF" stroke-width="10" stroke-linecap="round"/>
  <path d="M74 78h156l-12 140a14 14 0 0 1-14 12.8H100A14 14 0 0 1 86 218Z" fill="#FFFFFF"/>
  <path d="M74 78h156l-2.2 26H76.2Z" fill="#EEF2FF"/>
  <circle cx="112" cy="98" r="6" fill="#4338CA"/>
  <circle cx="192" cy="98" r="6" fill="#4338CA"/>
  <path d="M112 98v-26M192 98v-26" stroke="#4338CA" stroke-width="6" stroke-linecap="round"/>
  <path d="M136 136v52M136 164l30-26M150 152l22 36" stroke="#4338CA" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Price tag -->
  <g transform="rotate(-18 56 150)">
    <path d="M24 132h46l18 18-18 18H24a6 6 0 0 1-6-6v-24a6 6 0 0 1 6-6Z" fill="#FBBF24"/>
    <circle cx="70" cy="150" r="4.5" fill="#1E1B4B"/>
    <path d="M32 145h24M32 155h16" stroke="#1E1B4B" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Sparkles -->
  <path d="M262 52v20M252 62h20" stroke="#FBBF24" stroke-width="5" stroke-linecap="round"/>
  <path d="M46 52v12M40 58h12" stroke="#A5B4FC" stroke-width="4" stroke-linecap="round"/>
  <circle cx="240" cy="110" r="5" fill="#A5B4FC"/>
</svg>
